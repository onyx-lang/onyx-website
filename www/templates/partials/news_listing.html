{{ foreach article in articles }}
<div class="container news-item">
    <div class="news-item-header">
        <h2>
            <a href="/news/{% article.path %}">
                <span>{% $article.name %}</span>
            </a>
        </h2>
        <p class="news-item-date"><em>{% article.date %}</em></p>
    </div>
    <p class="news-item-summary">
        {% article.description %}
    </p>
</div>
{{ endforeach }}
